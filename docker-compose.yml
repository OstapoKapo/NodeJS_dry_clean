services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dryclean
      POSTGRES_PASSWORD: dryclean
      POSTGRES_DB: dryclean
    ports:
      - '5433:5432'
    volumes:
      - dryclean-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dryclean -d dryclean']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dryclean-db:
